
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My personal website">
    <title>Coming Soon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            color: #f0f6fc;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #8b949e;
            font-size: 1rem;
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 20px;
            color: #3fb950;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Hello, World.</h1>
        <p>Something new is on the way.</p>
        <div class="status">Website under construction</div>
